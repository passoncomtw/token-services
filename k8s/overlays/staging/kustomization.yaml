apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 引用各服务的配置
resources:
- namespace.yaml
- ../../services/token-admin-api
- ../../services/token-app-api
- ../../services/pos-backend-api
- ../../services/pos-merchant-service
- ingress.yaml

# Staging 命名空间
namespace: passontw-services-staging

# 镜像标签（统一使用 develop tag）
images:
  - name: ghcr.io/passoncomtw/token-admin-api
    newTag: develop
  - name: ghcr.io/passoncomtw/token-app-api
    newTag: develop
  - name: ghcr.io/passoncomtw/pos-backend-api
    newTag: develop
  - name: ghcr.io/passoncomtw/pos-merchant-service
    newTag: develop

# Staging 环境的资源配置
# 使用 JSON Patch 语法来修改副本数
  # Token Admin API - 2 副本
  
  # Token App API - 2 副本
  
  # POS Backend Service - 2 副本
  
  # POS Merchant Service - 2 副本
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: token-admin-api
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: token-app-api
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: pos-backend-api
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: pos-merchant-service
