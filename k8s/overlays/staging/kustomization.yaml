apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 引用各服务的配置
resources:
  - namespace.yaml
  - ../../services/token-admin-api
  - ../../services/token-app-api
  - ../../services/pos-backend-service
  - ../../services/pos-merchant-service
  - ingress.yaml

# 应用共用的配置补丁（从 base）
patchesStrategicMerge:
  - ../../base/common-patches.yaml
  - ../../base/common-secrets-env.yaml

# Staging 命名空间
namespace: passontw-services-staging

# 镜像标签（由 CI/CD 动态设置）
images:
  - name: ghcr.io/passoncomtw/token-admin-api
    newTag: develop-PLACEHOLDER  # 将被 CI/CD 替换
  - name: ghcr.io/passoncomtw/token-app-api
    newTag: develop-PLACEHOLDER  # 将被 CI/CD 替换
  - name: ghcr.io/passoncomtw/pos-backend-service
    newTag: develop-PLACEHOLDER  # 将被 CI/CD 替换
  - name: ghcr.io/passoncomtw/pos-merchant-service
    newTag: develop-PLACEHOLDER  # 将被 CI/CD 替换

# Staging 环境的资源配置
patches:
  # 副本数 - Token APIs
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: token-admin-api
  
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: token-app-api
  
  # 副本數 - POS Services
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: pos-backend-service
  
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: pos-merchant-service
  
  # Redis 配置 - 只应用到 Token APIs
  - path: ../../base/redis-secrets-env.yaml
    target:
      kind: Deployment
      name: token-admin-api
  
  - path: ../../base/redis-secrets-env.yaml
    target:
      kind: Deployment
      name: token-app-api
