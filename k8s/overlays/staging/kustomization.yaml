apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 引用各服务的配置
resources:
  - namespace.yaml
  - ../../services/token-admin-api
  - ../../services/token-app-api
  - ../../services/pos-backend-service
  - ../../services/pos-merchant-service
  - ingress.yaml

# Staging 命名空间
namespace: passontw-services-staging

# 镜像标签（由 CI/CD 动态设置）
images:
  - name: ghcr.io/passoncomtw/token-admin-api
    newTag: develop-PLACEHOLDER  # 将被 CI/CD 替换
  - name: ghcr.io/passoncomtw/token-app-api
    newTag: develop-PLACEHOLDER  # 将被 CI/CD 替换
  - name: ghcr.io/passoncomtw/pos-backend-service
    newTag: develop-PLACEHOLDER  # 将被 CI/CD 替换
  - name: ghcr.io/passoncomtw/pos-merchant-service
    newTag: develop-PLACEHOLDER  # 将被 CI/CD 替换

# Staging 环境的资源配置
# 使用 JSON Patch 语法来修改副本数
patches:
  # Token Admin API - 2 副本
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: token-admin-api
  
  # Token App API - 2 副本
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: token-app-api
  
  # POS Backend Service - 2 副本
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: pos-backend-service
  
  # POS Merchant Service - 2 副本
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: pos-merchant-service