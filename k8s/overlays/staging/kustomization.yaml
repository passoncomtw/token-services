apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 引用各服务的配置
resources:
  - namespace.yaml
  - ../../services/token-admin-api
  - ../../services/token-app-api
  - ../../services/pos-backend-service
  - ../../services/pos-merchant-service
  - ingress.yaml

# Staging 命名空间
namespace: passontw-services-staging

# 镜像标签（由 CI/CD 动态设置）
images:
  - name: ghcr.io/passoncomtw/token-admin-api
    newTag: develop-PLACEHOLDER  # 将被 CI/CD 替换
  - name: ghcr.io/passoncomtw/token-app-api
    newTag: develop-PLACEHOLDER  # 将被 CI/CD 替换
  - name: ghcr.io/passoncomtw/pos-backend-service
    newTag: develop-PLACEHOLDER  # 将被 CI/CD 替换
  - name: ghcr.io/passoncomtw/pos-merchant-service
    newTag: develop-PLACEHOLDER  # 将被 CI/CD 替换

# Staging 环境的资源配置
patches:
  # ============================================
  # 共用配置 - 应用到所有 Deployments
  # ============================================
  
  # 镜像拉取凭证和策略
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: all-deployments
      spec:
        template:
          spec:
            imagePullSecrets:
              - name: ghcr-pull-secret
            securityContext:
              fsGroup: 65534
            restartPolicy: Always
            containers:
              - name: container
                imagePullPolicy: Always
                resources:
                  requests:
                    memory: "128Mi"
                    cpu: "100m"
                  limits:
                    memory: "512Mi"
                    cpu: "500m"
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65534
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
    target:
      kind: Deployment
  
  # ============================================
  # 副本数配置
  # ============================================
  
  # Token APIs
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: token-admin-api
  
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: token-app-api
  
  # POS Services
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: pos-backend-service
  
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: pos-merchant-service