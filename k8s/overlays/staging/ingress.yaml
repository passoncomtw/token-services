apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: passontw-backend-apis-ingress-staging
  namespace: passontw-services-staging
  annotations:
    # Traefik Ingress Controller
    kubernetes.io/ingress.class: "traefik"
    
    # Cert-manager - 使用 Let's Encrypt Production 證書
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Traefik v3 - 使用 Middleware（HTTPS 重定向）
    # CORS 處理由應用程式層的 CORS middleware 負責（動態允許所有來源並支援 credentials）
    # 注意：redirect-https 會重定向 HTTP 到 HTTPS，但應用程式層的 CORS 會處理 HTTPS 請求
    traefik.ingress.kubernetes.io/router.middlewares: "passontw-services-staging-redirect-https@kubernetescrd"
spec:
  # TLS 配置 - Backend APIs 證書
  tls:
  # Token APIs
  - hosts:
    - token-admin-api.passon.tw
    secretName: token-admin-api-tls
  - hosts:
    - token-app-api.passon.tw
    secretName: token-app-api-tls
  
  # POS Services
  - hosts:
    - pos-backend-api.passon.tw
    secretName: pos-backend-api-tls
  - hosts:
    - pos-merchant-api.passon.tw
    secretName: pos-merchant-api-tls
  
  # 路由規則
  rules:
  # Token Admin API
  - host: token-admin-api.passon.tw
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: token-admin-api
            port:
              number: 80
  
  # Token App API
  - host: token-app-api.passon.tw
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: token-app-api
            port:
              number: 80
  
  # POS Backend API
  - host: pos-backend-api.passon.tw
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pos-backend-api
            port:
              number: 80
  
  # POS Merchant API
  - host: pos-merchant-api.passon.tw
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pos-merchant-api
            port:
              number: 80


