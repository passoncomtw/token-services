apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: passontw-backend-apis-ingress-staging
  namespace: passontw-services-staging
  annotations:
    # Traefik Ingress Controller
    kubernetes.io/ingress.class: "traefik"
    
    # Cert-manager - 使用 Let's Encrypt Production 證書
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Traefik - 強制 HTTPS 重定向
    traefik.ingress.kubernetes.io/redirect-entry-point: https
    traefik.ingress.kubernetes.io/redirect-permanent: "true"
    traefik.ingress.kubernetes.io/frontend-entry-points: http,https
    
    # 安全標頭 - HSTS, XSS Protection, etc.
    traefik.ingress.kubernetes.io/custom-response-headers: |
      Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
      X-Frame-Options: SAMEORIGIN
      X-Content-Type-Options: nosniff
      X-XSS-Protection: 1; mode=block
spec:
  # TLS 配置 - Backend APIs 證書
  tls:
  # Token APIs
  - hosts:
    - token-admin-api.passon.tw
    secretName: token-admin-api-tls
  - hosts:
    - token-app-api.passon.tw
    secretName: token-app-api-tls
  
  # POS Services
  - hosts:
    - pos-backend-api.passon.tw
    secretName: pos-backend-api-tls
  - hosts:
    - pos-merchant-api.passon.tw
    secretName: pos-merchant-api-tls
  
  # 路由規則
  rules:
  # Token Admin API
  - host: token-admin-api.passon.tw
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: token-admin-api
            port:
              number: 80
  
  # Token App API
  - host: token-app-api.passon.tw
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: token-app-api
            port:
              number: 80
  
  # POS Backend API
  - host: pos-backend-api.passon.tw
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pos-backend-api
            port:
              number: 80
  
  # POS Merchant API
  - host: pos-merchant-api.passon.tw
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pos-merchant-api
            port:
              number: 80


