apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors
  namespace: passontw-services-staging
spec:
  headers:
    # CORS 設定：允許所有來源（與應用程式層保持一致）
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    accessControlAllowOriginList:
      - "*"
    accessControlAllowHeaders:
      - Origin
      - Content-Type
      - Accept
      - Authorization
      - X-Requested-With
      - X-CSRF-Token
    accessControlExposeHeaders:
      - Content-Length
      - Content-Type
    # 預檢請求結果快取時間（12 小時 = 43200 秒）
    accessControlMaxAge: 43200
    # 當使用 "*" 作為來源時，必須設為 false
    accessControlAllowCredentials: false

