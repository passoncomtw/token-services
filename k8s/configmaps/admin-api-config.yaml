apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-api-config
  namespace: passontw-services
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  LOG_LEVEL: "info"
  CORS_ALLOWED_ORIGINS: "*"
  
  # Swagger 配置
  SWAGGER_HOST: "token-admin-web.passontw.com"
  SWAGGER_BASEPATH: "/"
  
  # 應用配置
  MAX_CONNECTIONS: "100"
  IDLE_TIMEOUT: "120s"
  READ_TIMEOUT: "30s"
  WRITE_TIMEOUT: "30s"

