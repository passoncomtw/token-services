apiVersion: v1
kind: ConfigMap
metadata:
  name: app-api-config
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  LOG_LEVEL: "info"
  CORS_ALLOWED_ORIGINS: "*"
  
  # Swagger 配置
  # SWAGGER_BASE_DOMAIN 會自動使用 HTTPS (如果設置)
  SWAGGER_BASE_DOMAIN: "token-app-api.passon.tw"
  
  # 應用配置
  MAX_CONNECTIONS: "100"
  IDLE_TIMEOUT: "120s"
  READ_TIMEOUT: "30s"
  WRITE_TIMEOUT: "30s"

