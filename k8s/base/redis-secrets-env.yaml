# Redis Secret 环境变量配置（只有 Token APIs 使用）

apiVersion: apps/v1
kind: Deployment
metadata:
  name: not-important
spec:
  template:
    spec:
      containers:
      - name: placeholder
        env:
        # Redis 配置（Token Admin/App API 使用）
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD
        - name: REDIS_DB
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_DB





