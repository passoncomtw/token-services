apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-api-config
  annotations:
    description: "此 ConfigMap 會在 CI/CD 部署時從 secrets.DEV_TOKEN_ADMIN 自動更新"
data:
  # 以下為預設值，實際值會在部署時從 GitHub Secrets 同步
  APP_ENV: "staging"
  HTTP_PORT: "8080"
  APP_PORT: "8080"
  LOG_LEVEL: "info"
  
  # CORS 設定：允許所有來源（與 Nginx/Traefik 保持一致）
  CORS_ALLOW_ORIGINS: "*"
  
  # Swagger 配置
  # SWAGGER_BASE_DOMAIN 會自動使用 HTTPS (如果設置)
  SWAGGER_BASE_DOMAIN: "token-admin-api.passon.tw"
  
  # 應用配置
  MAX_CONNECTIONS: "100"
  IDLE_TIMEOUT: "120s"
  READ_TIMEOUT: "30s"
  WRITE_TIMEOUT: "30s"
