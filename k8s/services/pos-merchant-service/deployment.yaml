apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-merchant-service
  labels:
    app: pos-merchant-service
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pos-merchant-service
  template:
    metadata:
      labels:
        app: pos-merchant-service
        version: v1
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      
      containers:
      - name: pos-merchant-service
        # 镜像标签由 Kustomize 在部署时动态设置
        image: ghcr.io/passoncomtw/pos-merchant-service:placeholder
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        env:
        # 從 ConfigMap 載入
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: pos-merchant-config
              key: APP_ENV
        - name: HTTP_PORT
          valueFrom:
            configMapKeyRef:
              name: pos-merchant-config
              key: HTTP_PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: pos-merchant-config
              key: LOG_LEVEL
        - name: LOG_DEVELOPMENT
          valueFrom:
            configMapKeyRef:
              name: pos-merchant-config
              key: LOG_DEVELOPMENT
        - name: LOG_ENCODING
          valueFrom:
            configMapKeyRef:
              name: pos-merchant-config
              key: LOG_ENCODING
        - name: SWAGGER_BASE_DOMAIN
          valueFrom:
            configMapKeyRef:
              name: pos-merchant-config
              key: SWAGGER_BASE_DOMAIN
        
        # 從 Secret 載入資料庫配置
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: DB_NAME
        - name: DB_SSL_MODE
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: DB_SSLMODE
        
        # 從 Secret 載入 JWT 配置
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        
        # 健康檢查
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # 資源限制
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # 安全上下文
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      
      # Pod 安全策略
      securityContext:
        fsGroup: 65534
      
      # 重啟策略
      restartPolicy: Always

