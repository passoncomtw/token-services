apiVersion: v1
kind: ConfigMap
metadata:
  name: app-api-config
  annotations:
    description: "此 ConfigMap 會在 CI/CD 部署時從 secrets.DEV_TOKEN_APP 自動更新"
data:
  # 以下為預設值，實際值會在部署時從 GitHub Secrets 同步
  APP_ENV: "staging"
  HTTP_PORT: "8080"
  APP_PORT: "8080"
  LOG_LEVEL: "info"
  # CORS 設定：允許的前端來源（多個來源用逗號分隔）
  CORS_ALLOW_ORIGINS: "http://localhost:5173,https://token-app-web.passon.tw"
  SWAGGER_BASE_DOMAIN: "token-app-api.passon.tw"
  MAX_CONNECTIONS: "100"
  IDLE_TIMEOUT: "120s"
  READ_TIMEOUT: "30s"
  WRITE_TIMEOUT: "30s"

