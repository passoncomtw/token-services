apiVersion: v1
kind: ConfigMap
metadata:
  name: app-api-config
data:
  APP_ENV: "staging"
  APP_PORT: "8080"
  LOG_LEVEL: "info"
  CORS_ALLOWED_ORIGINS: "*"
  SWAGGER_BASE_DOMAIN: "token-app-api.passon.tw"
  MAX_CONNECTIONS: "100"
  IDLE_TIMEOUT: "120s"
  READ_TIMEOUT: "30s"
  WRITE_TIMEOUT: "30s"

