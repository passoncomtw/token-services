apiVersion: v1
kind: ConfigMap
metadata:
  name: pos-merchant-config
  annotations:
    description: "此 ConfigMap 會在 CI/CD 部署時從 secrets.DEV_POS_MERCHANT 自動更新"
data:
  # 以下為預設值，實際值會在部署時從 GitHub Secrets 同步
  APP_ENV: "staging"
  HTTP_PORT: "8080"
  LOG_LEVEL: "info"
  LOG_DEVELOPMENT: "false"
  LOG_ENCODING: "json"
  SWAGGER_BASE_DOMAIN: "pos-merchant-api.passon.tw"
  # CORS 設定：允許的前端來源（多個來源用逗號分隔）
  CORS_ALLOW_ORIGINS: "http://localhost:5173,https://pos-merchant-web.passon.tw"


