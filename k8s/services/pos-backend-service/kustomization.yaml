apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 本地资源
resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml

# 应用共用的配置补丁
patchesStrategicMerge:
  - ../../base/common-patches.yaml       # 安全设置、资源限制
  - ../../base/common-secrets-env.yaml   # Database + JWT（POS 不需要 Redis）

# 镜像配置（将被 overlay 覆盖）
images:
  - name: ghcr.io/passoncomtw/pos-backend-service
    newTag: placeholder
