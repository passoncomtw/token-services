apiVersion: v1
kind: ConfigMap
metadata:
  name: pos-backend-config
  annotations:
    description: "此 ConfigMap 會在 CI/CD 部署時從 secrets.DEV_POS_BACKEND 自動更新"
data:
  # 以下為預設值，實際值會在部署時從 GitHub Secrets 同步
  APP_ENV: "staging"
  HTTP_PORT: "8080"
  LOG_LEVEL: "info"
  SWAGGER_BASE_DOMAIN: "pos-backend-api.passon.tw"
  # CORS 設定：允許的前端來源（多個來源用逗號分隔）
  CORS_ALLOW_ORIGINS: "http://localhost:5173,https://pos-backend-web.passon.tw"

