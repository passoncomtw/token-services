<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購物商城 - 登入</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #560CCE;
            --secondary-color: #414757;
            --background-color: #F5F5F5;
            --border-color: #E0E0E0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .ios-frame {
            width: 375px;
            height: 812px;
            background-color: white;
            border-radius: 40px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            border: 10px solid black;
            box-sizing: content-box;
        }
        
        .ios-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 30px;
            background-color: black;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
        }
        
        .app-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 30px 30px 30px;
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            background-color: white;
            border-radius: 25px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .logo .material-icons {
            font-size: 60px;
            color: var(--primary-color);
        }
        
        .app-name {
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
        }
        
        .tagline {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .login-form {
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .form-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #333;
        }
        
        .input-field {
            background-color: #F8F9FA;
            border-radius: 12px;
            border: 2px solid transparent;
            margin-bottom: 16px;
            height: 54px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            transition: border-color 0.3s ease;
        }
        
        .input-field:focus-within {
            border-color: var(--primary-color);
            background-color: white;
        }
        
        .input-field .material-icons {
            color: var(--secondary-color);
            margin-right: 12px;
            font-size: 22px;
        }
        
        .input-field input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
            color: #333;
        }
        
        .input-field input::placeholder {
            color: #999;
        }
        
        .login-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 17px;
            font-weight: 600;
            height: 54px;
            border-radius: 12px;
            border: none;
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s ease;
        }
        
        .login-button:active {
            transform: scale(0.98);
        }
        
        .demo-hint {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            background-color: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="ios-frame">
        <div class="ios-notch"></div>
        <div class="app-container">
            <div class="logo-container">
                <div class="logo">
                    <span class="material-icons">shopping_cart</span>
                </div>
                <h1 class="app-name">購物商城</h1>
                <p class="tagline">輕鬆購物，快速送達</p>
            </div>
            
            <div class="login-form">
                <h2 class="form-title">歡迎回來</h2>
                
                <form action="home.html">
                    <div class="input-field">
                        <span class="material-icons">phone</span>
                        <input type="tel" placeholder="手機號碼" value="0912345678" required>
                    </div>
                    
                    <div class="input-field">
                        <span class="material-icons">lock</span>
                        <input type="password" placeholder="密碼" value="password123" required>
                    </div>
                    
                    <button type="submit" class="login-button">登入</button>
                </form>
                
                <div class="demo-hint">
                    💡 示範帳號已填入
                </div>
            </div>
        </div>
    </div>
</body>
</html>
