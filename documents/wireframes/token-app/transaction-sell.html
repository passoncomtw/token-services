<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易 - E幣錢包</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="phone-container">
        <div class="phone-screen">
            <div class="notch"></div>
            
            <div class="status-bar">
                <span>9:41</span>
                <span>📶 📡 🔋</span>
            </div>
            
            <div class="top-bar">
                <h1>交易</h1>
                <a href="#" class="right-btn" onclick="alert('搜尋功能'); return false;">🔍</a>
            </div>
            
            <div class="content">
                <div class="tabs">
                    <a href="transaction-buy.html" class="tab">我要買</a>
                    <a href="transaction-sell.html" class="tab active">我要賣</a>
                </div>
                <div class="transaction-list">
                    <a href="create-order-sell.html" class="transaction-item">
                        <div class="transaction-header">
                            <div class="user-name">
                                趙六
                                <span style="margin-left: 8px; padding: 2px 8px; background: #4CAF50; color: white; border-radius: 4px; font-size: 11px;">在線</span>
                            </div>
                            <div class="transaction-amount">6,000 E幣</div>
                        </div>
                        <div class="transaction-info">
                            <span>單價: ¥1.00</span>
                            <span>限額: 100-6,000</span>
                        </div>
                        <div class="transaction-info">
                            <span>💳 銀行卡</span>
                            <span style="color: #4CAF50;">✓ 已認證</span>
                        </div>
                        <div class="transaction-info" style="margin-top: 8px;">
                            <span style="font-size: 12px; color: #666;">成交率: 97% | 成交次數: 123</span>
                            <span style="font-size: 12px; color: #FF9800;">⚡ 快速收款</span>
                        </div>
                    </a>
                    <a href="create-order-sell.html" class="transaction-item">
                        <div class="transaction-header">
                            <div class="user-name">
                                孫七
                                <span style="margin-left: 8px; padding: 2px 8px; background: #4CAF50; color: white; border-radius: 4px; font-size: 11px;">在線</span>
                            </div>
                            <div class="transaction-amount">10,000 E幣</div>
                        </div>
                        <div class="transaction-info">
                            <span>單價: ¥1.00</span>
                            <span>限額: 500-10,000</span>
                        </div>
                        <div class="transaction-info">
                            <span>💳 銀行卡</span>
                            <span style="color: #4CAF50;">✓ 已認證</span>
                        </div>
                        <div class="transaction-info" style="margin-top: 8px;">
                            <span style="font-size: 12px; color: #666;">成交率: 99% | 成交次數: 267</span>
                            <span style="font-size: 12px; color: #2196F3;">⭐ 信譽優良</span>
                        </div>
                    </a>
                </div>
            </div>
            
            <div class="bottom-nav">
                <a href="home.html" class="nav-item">
                    <div class="nav-icon">👛</div>
                    <div class="nav-label">錢包</div>
                </a>
                <a href="transaction-buy.html" class="nav-item active">
                    <div class="nav-icon">💱</div>
                    <div class="nav-label">交易</div>
                </a>
                <a href="pending.html" class="nav-item">
                    <div class="nav-icon">📋</div>
                    <div class="nav-label">掛單</div>
                </a>
                <a href="orders.html" class="nav-item">
                    <div class="nav-icon">🧾</div>
                    <div class="nav-label">訂單</div>
                </a>
                <a href="about.html" class="nav-item">
                    <div class="nav-icon">👤</div>
                    <div class="nav-label">我</div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
