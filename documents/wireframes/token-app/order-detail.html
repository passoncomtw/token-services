<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單詳情 - E幣錢包</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="phone-container">
        <div class="phone-screen">
            <div class="notch"></div>
            
            <div class="status-bar">
                <span>9:41</span>
                <span>📶 📡 🔋</span>
            </div>
            
            <div class="top-bar">
                <a href="orders.html" class="back-btn">‹</a>
                <h1>訂單詳情</h1>
            </div>
            
            <div class="content">
                <div class="section">
                    <div style="text-align: center; padding: 24px 0;">
                        <div style="font-size: 48px; margin-bottom: 16px;">✅</div>
                        <div style="font-size: 20px; font-weight: bold; color: #4CAF50; margin-bottom: 8px;">訂單已完成</div>
                        <div style="color: #666;">感謝您的交易</div>
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">訂單資訊</div>
                    <div class="label-text">
                        <span class="label">訂單編號</span>
                        <span class="text">202311250001</span>
                    </div>
                    <div class="label-text">
                        <span class="label">訂單類型</span>
                        <span class="text">買入</span>
                    </div>
                    <div class="label-text">
                        <span class="label">數量</span>
                        <span class="text">1,000 E幣</span>
                    </div>
                    <div class="label-text">
                        <span class="label">交易金額</span>
                        <span class="text" style="color: #E9967A; font-weight: bold;">CNY ¥1,000</span>
                    </div>
                    <div class="label-text">
                        <span class="label">對方暱稱</span>
                        <span class="text">張三</span>
                    </div>
                    <div class="label-text">
                        <span class="label">創建時間</span>
                        <span class="text">2023-11-25 10:30</span>
                    </div>
                    <div class="label-text">
                        <span class="label">完成時間</span>
                        <span class="text">2023-11-25 10:45</span>
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">交易帳戶</div>
                    <div class="label-text">
                        <span class="label">銀行名稱</span>
                        <span class="text">中國銀行</span>
                    </div>
                    <div class="label-text">
                        <span class="label">卡號</span>
                        <span class="text">6217 **** **** 1234</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
