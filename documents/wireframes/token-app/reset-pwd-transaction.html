<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改交易密碼 - E幣錢包</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="phone-container">
        <div class="phone-screen">
            <div class="notch"></div>
            
            <div class="status-bar">
                <span>9:41</span>
                <span>📶 📡 🔋</span>
            </div>
            
            <div class="top-bar">
                <a href="password.html" class="back-btn">‹</a>
                <h1>修改交易密碼</h1>
            </div>
            
            <div class="content">
                <div class="section">
                    <div class="input-field">
                        <label>舊交易密碼</label>
                        <input type="password" placeholder="請輸入舊交易密碼">
                    </div>
                    <div class="input-field">
                        <label>新交易密碼</label>
                        <input type="password" placeholder="請輸入新交易密碼">
                    </div>
                    <div class="input-field">
                        <label>再次輸入新交易密碼</label>
                        <input type="password" placeholder="請再次輸入新交易密碼">
                    </div>
                    <a href="password.html" class="btn-primary" onclick="alert('密碼修改成功！')">完成</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
