<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出售e幣 - E幣錢包</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="phone-container">
        <div class="phone-screen">
            <div class="notch"></div>
            
            <div class="status-bar">
                <span>9:41</span>
                <span>📶 📡 🔋</span>
            </div>
            
            <div class="top-bar">
                <a href="transaction-sell.html" class="back-btn">‹</a>
                <h1>出售e幣</h1>
            </div>
            
            <div class="content">
                <div class="section">
                    <div style="background: #e3f2fd; padding: 12px; border-radius: 4px; margin-bottom: 16px;">
                        <div style="font-size: 14px; color: #1976d2;">
                            可交易數量: <strong>100 - 6,000</strong>
                        </div>
                    </div>
                    <div class="input-field">
                        <label>數量</label>
                        <input type="number" placeholder="請輸入出售數量" value="1000">
                        <div style="font-size: 12px; color: #666; margin-top: 4px;">e幣可用餘額 10,000</div>
                    </div>
                    <div class="label-text">
                        <span class="label">交易金額</span>
                        <span class="text" style="color: #E9967A; font-weight: bold;">CNY ¥1,000</span>
                    </div>
                    <div class="input-field">
                        <label>交易帳戶</label>
                        <a href="card-list.html" style="text-decoration: none;">
                            <div style="padding: 12px; border: 1px solid #ddd; border-radius: 4px;">
                                <div style="color: #999;">請選擇收款帳戶</div>
                            </div>
                        </a>
                        <div class="hint" style="margin-top: 8px;">
                            買方將以您提供的交易帳戶進行打款
                        </div>
                    </div>
                    <div class="input-field">
                        <label>交易密碼</label>
                        <input type="password" placeholder="請輸入交易密碼">
                    </div>
                    <a href="confirm-order-sell.html" class="btn-primary">出售e幣</a>
                </div>
                <div class="section">
                    <div class="section-title">交易資訊</div>
                    <div class="label-text">
                        <span class="label">收款期限</span>
                        <span class="text">15 分鐘</span>
                    </div>
                    <div class="label-text">
                        <span class="label">買家暱稱</span>
                        <span class="text">趙六</span>
                    </div>
                    <div class="label-text">
                        <span class="label">收付方式</span>
                        <span class="text">銀行卡</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
