<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊 - E幣錢包</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="phone-container">
        <div class="phone-screen">
            <div class="notch"></div>
            
            <div class="status-bar">
                <span>9:41</span>
                <span>📶 📡 🔋</span>
            </div>
            
            <div class="top-bar">
                <a href="login.html" class="back-btn">‹</a>
                <h1>註冊</h1>
            </div>
            
            <div class="content">
                <div style="padding: 16px;">
                    <div class="input-field">
                        <label>暱稱</label>
                        <input type="text" placeholder="請輸入暱稱">
                    </div>
                    <div class="input-field">
                        <label>帳號</label>
                        <input type="text" placeholder="請輸入帳號">
                    </div>
                    <div class="input-field">
                        <label>郵箱</label>
                        <input type="email" placeholder="請輸入郵箱">
                    </div>
                    <div class="input-field">
                        <label>登入密碼</label>
                        <input type="password" placeholder="請輸入登入密碼">
                    </div>
                    <div class="input-field">
                        <label>再次輸入登入密碼</label>
                        <input type="password" placeholder="請再次輸入登入密碼">
                    </div>
                    <div class="input-field">
                        <label>交易密碼</label>
                        <input type="password" placeholder="請輸入交易密碼">
                    </div>
                    <div class="input-field">
                        <label>再次輸入交易密碼</label>
                        <input type="password" placeholder="請再次輸入交易密碼">
                    </div>
                    <div class="input-field">
                        <label>推薦碼（選填）</label>
                        <input type="text" placeholder="請輸入推薦碼">
                    </div>
                    <a href="login.html" class="btn-primary">完成</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
