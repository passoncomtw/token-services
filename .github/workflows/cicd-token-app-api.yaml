name: Build Token App API

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/cicd-token-app-api.yaml'
      - 'cmd/token-app-api/**'
      - 'pkg/**'
      - 'deploy/token-app-api/**'
      - 'k8s/services/token-app-api/**'
      - 'k8s/overlays/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      skip_build:
        description: '跳過構建，只重新部署'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/token-app-api
  SERVICE_NAME: token-app-api
  NAMESPACE: passontw-services-staging

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_build || github.event_name == 'push' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_FULL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="develop"
          
          echo "Building image: $IMAGE_FULL:$TAG"
          
          docker build \
            --file ./deploy/token-app-api/Dockerfile \
            --tag "$IMAGE_FULL:$TAG" \
            .
          
          echo "Pushing image..."
          docker push "$IMAGE_FULL:$TAG"
          
          echo "✅ Build and push completed"

  deploy:
    runs-on: mac-mini-build
    needs: build
    if: always() && (needs.build.result == 'success' || (inputs.skip_build && github.event_name == 'workflow_dispatch'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update ConfigMap from .env
        run: |
          echo "📝 更新 ConfigMap..."
          
          # 從 GitHub Secret 創建臨時 .env 文件
          echo "${{ secrets.DEV_TOKEN_APP }}" > /tmp/token-app-full.env
          
          # 將所有環境變數寫入 ConfigMap（包括敏感信息）
          # 注意：ConfigMap 在 Kubernetes 中有 RBAC 保護
          cp /tmp/token-app-full.env /tmp/token-app.env
          
          # 如果過濾後的文件不為空，則更新 ConfigMap
          if [ -s /tmp/token-app.env ]; then
            echo "📦 更新 ConfigMap（已過濾敏感信息）..."
            kubectl create configmap app-api-config \
              --from-env-file=/tmp/token-app.env \
              --dry-run=client -o yaml | \
              kubectl apply -f - -n ${{ env.NAMESPACE }}
            echo "✅ ConfigMap 已更新"
          else
            echo "⚠️  所有變量都是敏感信息，ConfigMap 保持不變"
          fi
          
          # 清理臨時文件
          rm -f /tmp/token-app-full.env /tmp/token-app.env

      - name: Deploy to Kubernetes
        id: deploy
        run: |
          IMAGE_FULL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop"
          
          echo "🚀 開始部署 token-app-api..."
          echo "📦 Image: ${IMAGE_FULL}"
          echo "📍 Namespace: ${{ env.NAMESPACE }}"
          
          # 更新鏡像並觸發滾動更新
          kubectl set image deployment/token-app-api \
            token-app-api=${IMAGE_FULL} \
            -n ${{ env.NAMESPACE }}
          
          echo "✅ 鏡像已更新，滾動更新已觸發"

      - name: Wait for deployment
        id: wait
        run: |
          echo "⏳ 等待部署完成（超時 5 分鐘）..."
          
          if kubectl rollout status deployment/${{ env.SERVICE_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=5m; then
            echo "✅ 部署成功"
            echo "deployment_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ 部署超時或失敗"
            echo "deployment_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify deployment
        if: steps.wait.outputs.deployment_status == 'success'
        run: |
          echo "🔍 驗證部署狀態..."
          
          # 獲取 pod 狀態
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.SERVICE_NAME }}
          
          # 檢查 pod 是否健康
          READY_PODS=$(kubectl get pods -n ${{ env.NAMESPACE }} \
            -l app=${{ env.SERVICE_NAME }} \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[*].metadata.name}' | wc -w)
          
          echo "✅ 健康的 Pods 數量: ${READY_PODS}"
          
          if [ "$READY_PODS" -eq 0 ]; then
            echo "❌ 沒有健康的 Pod"
            exit 1
          fi

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ 部署失敗，執行自動回滾..."
          
          # 回滾到上一個版本
          kubectl rollout undo deployment/${{ env.SERVICE_NAME }} \
            -n ${{ env.NAMESPACE }}
          
          echo "⏳ 等待回滾完成..."
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=3m
          
          echo "✅ 已回滾到上一個版本"
          
          # 顯示當前狀態
          echo ""
          echo "📊 當前部署狀態："
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.SERVICE_NAME }}

      - name: Deployment summary
        if: success()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 ${{ env.SERVICE_NAME }} 部署成功"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop"
          echo "📍 Namespace: ${{ env.NAMESPACE }}"
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "👤 Triggered by: ${{ github.actor }}"
            echo "🔧 Skip build: ${{ inputs.skip_build }}"
          fi
          
          echo ""
          echo "Pod 狀態："
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.SERVICE_NAME }}
          echo ""
          echo "Service 狀態："
          kubectl get svc -n ${{ env.NAMESPACE }} ${{ env.SERVICE_NAME }}
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
