name: Build Token Admin API

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/cicd-token-admin-api.yaml'
      - 'cmd/token-admin-api/**'
      - 'pkg/**'
      - 'deploy/token-admin-api/**'
      - 'k8s/services/token-admin-api/**'
      - 'k8s/overlays/**'
      - 'go.mod'
      - 'go.sum'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/token-admin-api
  SERVICE_NAME: token-admin-api
  NAMESPACE: passontw-services-staging

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          TAG="develop"
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "📦 Image tag: ${TAG}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_FULL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="develop"
          
          echo "Building image: $IMAGE_FULL:$TAG"
          
          docker build \
            --file ./deploy/token-admin-api/Dockerfile \
            --tag "$IMAGE_FULL:$TAG" \
            .
          
          echo "Pushing image..."
          docker push "$IMAGE_FULL:$TAG"
          
          echo "✅ Build and push completed"

  deploy:
    runs-on: mac-mini-build
    needs: build
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update ConfigMap from .env
        run: |
          echo "📝 更新 ConfigMap..."
          
          # 從 GitHub Secret 創建臨時 .env 文件
          echo "${{ secrets.DEV_TOKEN_ADMIN }}" > /tmp/token-admin-full.env
          
          # 過濾敏感信息（排除包含 SECRET, PASSWORD, KEY, TOKEN 的變量）
          # 這些應該在 Kubernetes Secrets 中管理，不應放在 ConfigMap
          grep -v -E '(SECRET|PASSWORD|KEY|TOKEN)=' /tmp/token-admin-full.env > /tmp/token-admin.env || true
          
          # 如果過濾後的文件不為空，則更新 ConfigMap
          if [ -s /tmp/token-admin.env ]; then
            echo "📦 更新 ConfigMap（已過濾敏感信息）..."
            kubectl create configmap admin-api-config \
              --from-env-file=/tmp/token-admin.env \
              --dry-run=client -o yaml | \
              kubectl apply -f - -n ${{ env.NAMESPACE }}
            echo "✅ ConfigMap 已更新"
          else
            echo "⚠️  所有變量都是敏感信息，ConfigMap 保持不變"
          fi
          
          # 清理臨時文件
          rm -f /tmp/token-admin-full.env /tmp/token-admin.env

      - name: Deploy to Kubernetes
        id: deploy
        run: |
          echo "🚀 開始部署 token-admin-api..."
          echo "📦 Image: ghcr.io/passoncomtw/token-admin-api:develop"
          echo "📍 Namespace: ${{ env.NAMESPACE }}"
          
          # 更新鏡像並觸發滾動更新
          kubectl set image deployment/token-admin-api \
            token-admin-api=ghcr.io/passoncomtw/token-admin-api:develop \
            -n ${{ env.NAMESPACE }}
          
          echo "✅ 鏡像已更新，滾動更新已觸發"

      - name: Wait for deployment
        id: wait
        run: |
          echo "⏳ 等待部署完成（超時 5 分鐘）..."
          
          if kubectl rollout status deployment/${{ env.SERVICE_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=5m; then
            echo "✅ 部署成功"
            echo "deployment_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ 部署超時或失敗"
            echo "deployment_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify deployment
        if: steps.wait.outputs.deployment_status == 'success'
        run: |
          echo "🔍 驗證部署狀態..."
          
          # 獲取 pod 狀態
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.SERVICE_NAME }}
          
          # 檢查 pod 是否健康
          READY_PODS=$(kubectl get pods -n ${{ env.NAMESPACE }} \
            -l app=${{ env.SERVICE_NAME }} \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[*].metadata.name}' | wc -w)
          
          echo "✅ 健康的 Pods 數量: ${READY_PODS}"
          
          if [ "$READY_PODS" -eq 0 ]; then
            echo "❌ 沒有健康的 Pod"
            exit 1
          fi

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ 部署失敗，執行自動回滾..."
          
          # 回滾到上一個版本
          kubectl rollout undo deployment/${{ env.SERVICE_NAME }} \
            -n ${{ env.NAMESPACE }}
          
          echo "⏳ 等待回滾完成..."
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=3m
          
          echo "✅ 已回滾到上一個版本"
          
          # 顯示當前狀態
          echo ""
          echo "📊 當前部署狀態："
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.SERVICE_NAME }}

      - name: Deployment summary
        if: success()
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 ${{ env.SERVICE_NAME }} 部署成功"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          echo "📍 Namespace: ${{ env.NAMESPACE }}"
          echo ""
          echo "Pod 狀態："
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.SERVICE_NAME }}
          echo ""
          echo "Service 狀態："
          kubectl get svc -n ${{ env.NAMESPACE }} ${{ env.SERVICE_NAME }}
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
