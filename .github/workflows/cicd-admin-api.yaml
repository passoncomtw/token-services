name: Build Token Admin API

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/cicd-admin-api.yaml'
      - 'cmd/token-admin-api/**'
      - 'pkg/**'
      - 'deploy/token-admin-api/**'
      - 'k8s/deployments/token-admin-api.yaml'
      - 'k8s/services/token-admin-api-service.yaml'
      - 'k8s/configmaps/admin-api-config.yaml'
      - 'go.mod'
      - 'go.sum'
  # workflow_dispatch:
  #   inputs:
  #     environment:
  #       description: '部署環境'
  #       required: false
  #       type: choice
  #       options:
  #         - auto
  #         - staging
  #         - production
  #       default: auto
  #     skip_build:
  #       description: '跳過構建（僅部署）'
  #       required: false
  #       type: boolean
  #       default: false
  #     image_tag:
  #       description: '映像標籤（跳過構建時使用）'
  #       required: false
  #       type: string

env:
  IMAGE_NAME: passon/token-admin-api

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="${{ env.IMAGE_NAME }}"
          TAG="develop"
          
          echo "Building image: $IMAGE_NAME:$TAG"
          
          docker build \
            --file ./deploy/token-admin-api/Dockerfile \
            --tag "$IMAGE_NAME:$TAG" \
            .
          
          echo "Pushing image: $IMAGE_NAME:$TAG"
          docker push "$IMAGE_NAME:$TAG"
          
          echo "✅ Build and push completed"
