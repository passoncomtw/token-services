name: Build Token Admin API

on:
  push:
    branches: [develop, main]
    paths:
      - '.github/workflows/build-token-admin-api.yml'
      - 'cmd/token-admin-api/**'
      - 'pkg/**'
      - 'deploy/token-admin-api/**'
      - 'go.mod'
      - 'go.sum'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/token-admin-api

permissions:
  contents: read
  packages: write

jobs:
  build-only:
    runs-on: mac-mini-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=sha

      - name: Build Docker image (不推送)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/token-admin-api/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Verify build
        run: |
          echo "🔍 驗證建置結果..."
          
          # 列出剛建置的映像
          docker images | grep token-admin-api || true
          
          # 取得第一個標籤進行測試
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "測試映像: $FIRST_TAG"
          
          # 檢查映像是否存在
          if docker image inspect "$FIRST_TAG" > /dev/null 2>&1; then
            echo "✅ 映像建置成功"
            
            # 顯示映像資訊
            echo ""
            echo "映像大小:"
            docker images "$FIRST_TAG" --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          else
            echo "❌ 映像建置失敗"
            exit 1
          fi

      - name: Cleanup - Remove built images
        if: always()
        run: |
          echo "🧹 清理建置的映像..."
          
          # 刪除所有建置的映像
          TAGS="${{ steps.meta.outputs.tags }}"
          
          for TAG in $TAGS; do
            if docker image inspect "$TAG" > /dev/null 2>&1; then
              echo "刪除: $TAG"
              docker rmi "$TAG" || true
            fi
          done
          
          # 清理懸掛的映像
          echo ""
          echo "清理懸掛映像..."
          docker image prune -f
          
          echo "✅ 清理完成"

      - name: Configure Docker & Login (macOS 鑰匙圈修復)
        if: success()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/.docker
        run: |
          echo "🔧 配置 Docker 並登入 Registry..."
          
          # 使用臨時目錄作為 Docker 配置目錄，完全避開系統配置
          export DOCKER_CONFIG="${{ runner.temp }}/.docker"
          mkdir -p "$DOCKER_CONFIG"
          
          echo "Docker 配置目錄: $DOCKER_CONFIG"
          
          # 建立一個乾淨的配置文件（不使用任何憑證存儲）
          cat > "$DOCKER_CONFIG/config.json" << 'EOF'
          {
            "auths": {}
          }
          EOF
          
          echo "✅ 已建立乾淨的 Docker 配置"
          
          # 使用 --password-stdin 安全地登入
          echo "🔐 登入到 ${{ env.REGISTRY }}..."
          echo "${{ secrets.GHCR_TOKEN }}" | docker --config "$DOCKER_CONFIG" login ${{ env.REGISTRY }} -u ${{ secrets.GHCR_USERNAME }} --password-stdin
          
          # 驗證登入狀態
          if docker --config "$DOCKER_CONFIG" info > /dev/null 2>&1; then
            echo "✅ Docker 登入成功"
          else
            echo "❌ Docker 登入可能失敗"
            exit 1
          fi
          
          # 將 DOCKER_CONFIG 環境變數保存到 GITHUB_ENV，供後續步驟使用
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> $GITHUB_ENV
          
          echo "✅ 配置與登入完成"

      - name: Push Docker image
        if: success()
        run: |
          echo "📦 推送映像到 Registry..."
          echo "使用 Docker 配置: $DOCKER_CONFIG"
          
          # 推送所有標籤
          TAGS="${{ steps.meta.outputs.tags }}"
          for TAG in $TAGS; do
            echo "推送: $TAG"
            docker --config "$DOCKER_CONFIG" push "$TAG"
          done
          
          echo "✅ 所有映像已推送"

      - name: Generate build summary
        if: success()
        run: |
          echo "## ✅ Token Admin API 建置與推送成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 建置資訊" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **平台**: linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- **Dockerfile**: \`./deploy/token-admin-api/Dockerfile\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 映像標籤" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup Docker credentials
        if: always()
        run: |
          echo "🧹 清理 Docker 憑證..."
          
          # 使用臨時配置登出
          if [ -n "$DOCKER_CONFIG" ] && [ -d "$DOCKER_CONFIG" ]; then
            echo "登出 Docker Registry..."
            docker --config "$DOCKER_CONFIG" logout ${{ env.REGISTRY }} 2>/dev/null || true
            
            # 刪除臨時配置目錄
            echo "刪除臨時 Docker 配置: $DOCKER_CONFIG"
            rm -rf "$DOCKER_CONFIG"
            echo "✅ 已刪除臨時配置"
          else
            echo "⚠️  找不到臨時 Docker 配置目錄"
          fi
          
          echo "✅ 清理完成"