name: Build Token Admin API

on:
  push:
    branches: [develop, main]
    paths:
      - '.github/workflows/build-token-admin-api.yml'
      - 'cmd/token-admin-api/**'
      - 'pkg/**'
      - 'deploy/token-admin-api/**'
      - 'go.mod'
      - 'go.sum'

env:
  REGISTRY: docker.io
  IMAGE_NAME: passon/token-admin-api

permissions:
  contents: read

jobs:
  test-docker-login:
    runs-on: mac-mini-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Verify login success
        run: |
          echo "## ✅ Docker Hub 登入成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 認證資訊" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Username**: ${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Image**: ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 下一步" >> $GITHUB_STEP_SUMMARY
          echo "登入驗證成功！可以開始建置和推送 Docker 映像。" >> $GITHUB_STEP_SUMMARY

