name: Build Token Admin API

on:
  push:
    branches: [develop, main]
    paths:
      - '.github/workflows/build-token-admin-api.yml'
      - 'cmd/token-admin-api/**'
      - 'pkg/**'
      - 'deploy/token-admin-api/**'
      - 'go.mod'
      - 'go.sum'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/token-admin-api

permissions:
  contents: read
  packages: write

jobs:
  build-only:
    runs-on: mac-mini-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=sha

      - name: Build Docker image (不推送)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/token-admin-api/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Verify build
        run: |
          echo "🔍 驗證建置結果..."
          
          # 列出剛建置的映像
          docker images | grep token-admin-api || true
          
          # 取得第一個標籤進行測試
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "測試映像: $FIRST_TAG"
          
          # 檢查映像是否存在
          if docker image inspect "$FIRST_TAG" > /dev/null 2>&1; then
            echo "✅ 映像建置成功"
            
            # 顯示映像資訊
            echo ""
            echo "映像大小:"
            docker images "$FIRST_TAG" --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          else
            echo "❌ 映像建置失敗"
            exit 1
          fi

      - name: Cleanup - Remove built images
        if: always()
        run: |
          echo "🧹 清理建置的映像..."
          
          # 刪除所有建置的映像
          TAGS="${{ steps.meta.outputs.tags }}"
          
          for TAG in $TAGS; do
            if docker image inspect "$TAG" > /dev/null 2>&1; then
              echo "刪除: $TAG"
              docker rmi "$TAG" || true
            fi
          done
          
          # 清理懸掛的映像
          echo ""
          echo "清理懸掛映像..."
          docker image prune -f
          
          echo "✅ 清理完成"

      - name: Generate build summary
        if: success()
        run: |
          echo "## ✅ Token Admin API 編譯測試成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 建置資訊" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **平台**: linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- **Dockerfile**: \`./deploy/token-admin-api/Dockerfile\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 測試標籤" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 狀態" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 編譯成功" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 映像已驗證" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 映像已清理" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 此為編譯測試，映像不會推送到 Registry" >> $GITHUB_STEP_SUMMARY
