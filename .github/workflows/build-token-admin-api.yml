name: Build Token Admin API

on:
  push:
    branches: [develop, main]
    paths:
      - '.github/workflows/build-token-admin-api.yml'
      - 'cmd/token-admin-api/**'
      - 'pkg/**'
      - 'deploy/token-admin-api/**'
      - 'go.mod'
      - 'go.sum'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/token-admin-api

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: mac-mini-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=sha

      - name: Build Docker image (不推送)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/token-admin-api/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Verify build
        run: |
          echo "🔍 驗證建置結果..."
          
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "測試映像: $FIRST_TAG"
          
          if docker image inspect "$FIRST_TAG" > /dev/null 2>&1; then
            echo "✅ 映像建置成功"
            docker images "$FIRST_TAG" --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          else
            echo "❌ 映像建置失敗"
            exit 1
          fi

      - name: Configure Docker authentication
        if: success()
        run: |
          echo "🔧 配置 Docker 認證..."
          
          export DOCKER_CONFIG="${{ runner.temp }}/.docker"
          mkdir -p "$DOCKER_CONFIG"
          
          AUTH_STRING="${{ secrets.GHCR_USERNAME }}:${{ secrets.GHCR_TOKEN }}"
          AUTH_BASE64=$(echo -n "$AUTH_STRING" | base64)
          
          cat > "$DOCKER_CONFIG/config.json" << EOF
          {
            "auths": {
              "${{ env.REGISTRY }}": {
                "auth": "$AUTH_BASE64"
              }
            }
          }
          EOF
          
          if [ -f "$DOCKER_CONFIG/config.json" ]; then
            echo "✅ 認證配置完成 - Registry: ${{ env.REGISTRY }}"
            echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> $GITHUB_ENV
          else
            echo "❌ 配置建立失敗"
            exit 1
          fi

      - name: Push Docker image
        if: success()
        run: |
          echo "📦 推送映像到 Registry..."
          
          TAGS="${{ steps.meta.outputs.tags }}"
          for TAG in $TAGS; do
            echo "推送: $TAG"
            docker --config "$DOCKER_CONFIG" push "$TAG"
          done
          
          echo "✅ 所有映像已推送"

      - name: Generate build summary
        if: success()
        run: |
          echo "## ✅ Token Admin API 建置與推送成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 建置資訊" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **平台**: linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- **Dockerfile**: \`./deploy/token-admin-api/Dockerfile\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 映像標籤" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup built images
        if: always()
        run: |
          echo "🧹 清理建置的映像..."
          
          TAGS="${{ steps.meta.outputs.tags }}"
          for TAG in $TAGS; do
            if docker image inspect "$TAG" > /dev/null 2>&1; then
              docker rmi "$TAG" || true
            fi
          done
          
          docker image prune -f
          echo "✅ 映像清理完成"

      - name: Cleanup Docker credentials
        if: always()
        run: |
          echo "🧹 清理 Docker 憑證..."
          
          if [ -n "$DOCKER_CONFIG" ] && [ -d "$DOCKER_CONFIG" ]; then
            docker --config "$DOCKER_CONFIG" logout ${{ env.REGISTRY }} 2>/dev/null || true
            rm -rf "$DOCKER_CONFIG"
            echo "✅ 憑證清理完成"
          fi