name: Build Token Admin API

on:
  push:
    branches: [develop, main]
    paths:
      - '.github/workflows/build-token-admin-api.yml'
      - 'cmd/token-admin-api/**'
      - 'pkg/**'
      - 'deploy/token-admin-api/**'
      - 'go.mod'
      - 'go.sum'

env:
  REGISTRY: docker.io
  IMAGE_NAME: passon/token-admin-api

permissions:
  contents: read

jobs:
  test-docker-login:
    runs-on: mac-mini-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Legacy Docker Build (last resort)
        run: |
            echo "=== Legacy Docker Build ==="
            
            # 設定變數
            IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            TAG="develop"
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            
            echo "Building image with legacy docker build: $IMAGE_NAME:$TAG"
            
            echo "Building image with legacy docker build: $IMAGE_NAME:$TAG"
            # 移除舊的建構器（如果存在）
            docker buildx rm multiplatform || true
            