name: Build Token Admin API

on:
  push:
    branches: [develop, main]
    paths:
      - '.github/workflows/build-token-admin-api.yml'
      - 'cmd/token-admin-api/**'
      - 'pkg/**'
      - 'deploy/token-admin-api/**'
      - 'go.mod'
      - 'go.sum'

env:
  REGISTRY: docker.io
  IMAGE_NAME: passon/token-admin-api

permissions:
  contents: read

jobs:
  test-docker-login:
    runs-on: mac-mini-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Docker for CI
        run: |
          # 移除 credential helper，改用文件存儲
          mkdir -p ~/.docker
          cat > ~/.docker/config.json <<EOF
          {
            "auths": {},
            "credsStore": ""
          }
          EOF
          echo "✅ Docker 配置已更新為 CI 模式"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Verify Docker Hub access
        run: |
          echo "🔍 測試 Docker Hub 連線..."
          
          # 嘗試拉取一個公開映像來驗證連線
          docker pull alpine:latest
          
          # 檢查登入狀態
          if docker info | grep -q "Username"; then
            echo "✅ Docker Hub 登入驗證成功"
          else
            echo "⚠️ 登入狀態未知，但連線正常"
          fi
          
          echo "✅ Docker Hub 訪問測試完成"

      - name: Generate success summary
        run: |
          echo "## ✅ Docker Hub 登入成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 認證資訊" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Username**: ${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Image**: ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 測試結果" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker 配置已更新為 CI 模式" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker Hub 登入成功" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker Hub 連線測試通過" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 下一步" >> $GITHUB_STEP_SUMMARY
          echo "登入驗證成功！可以開始建置和推送 Docker 映像。" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# 手動建置並推送" >> $GITHUB_STEP_SUMMARY
          echo "./scripts/build-and-push-admin.sh" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

