name: Build Token Admin API

on:
  push:
    branches: [develop, main]
    paths:
      - '.github/workflows/build-token-admin-api.yml'
      - 'cmd/token-admin-api/**'
      - 'pkg/**'
      - 'deploy/token-admin-api/**'
      - 'go.mod'
      - 'go.sum'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/token-admin-api

permissions:
  contents: read
  packages: write

jobs:
  build-only:
    runs-on: mac-mini-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=sha

      - name: Build Docker image (不推送)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/token-admin-api/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Verify build
        run: |
          echo "🔍 驗證建置結果..."
          
          # 列出剛建置的映像
          docker images | grep token-admin-api || true
          
          # 取得第一個標籤進行測試
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "測試映像: $FIRST_TAG"
          
          # 檢查映像是否存在
          if docker image inspect "$FIRST_TAG" > /dev/null 2>&1; then
            echo "✅ 映像建置成功"
            
            # 顯示映像資訊
            echo ""
            echo "映像大小:"
            docker images "$FIRST_TAG" --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          else
            echo "❌ 映像建置失敗"
            exit 1
          fi

      - name: Cleanup - Remove built images
        if: always()
        run: |
          echo "🧹 清理建置的映像..."
          
          # 刪除所有建置的映像
          TAGS="${{ steps.meta.outputs.tags }}"
          
          for TAG in $TAGS; do
            if docker image inspect "$TAG" > /dev/null 2>&1; then
              echo "刪除: $TAG"
              docker rmi "$TAG" || true
            fi
          done
          
          # 清理懸掛的映像
          echo ""
          echo "清理懸掛映像..."
          docker image prune -f
          
          echo "✅ 清理完成"

      - name: Configure Docker (macOS 鑰匙圈修復)
        if: success()
        run: |
          echo "🔧 配置 Docker 不使用 macOS 鑰匙圈..."
          
          # 備份原始配置（如果存在）
          if [ -f ~/.docker/config.json ]; then
            cp ~/.docker/config.json ~/.docker/config.json.backup
            echo "已備份現有配置"
          fi
          
          # 建立 Docker 配置目錄
          mkdir -p ~/.docker
          
          # 使用 Python 移除 credsStore 配置
          python3 << 'EOF'
          import json
          import os
          
          config_path = os.path.expanduser('~/.docker/config.json')
          
          # 讀取或建立配置
          if os.path.exists(config_path):
              with open(config_path, 'r') as f:
                  try:
                      config = json.load(f)
                  except:
                      config = {}
          else:
              config = {}
          
          # 移除 credsStore（macOS 鑰匙圈）
          if 'credsStore' in config:
              del config['credsStore']
              print("已移除 credsStore 設定")
          
          # 移除 credHelpers（特定 registry 的憑證助手）
          if 'credHelpers' in config:
              del config['credHelpers']
              print("已移除 credHelpers 設定")
          
          # 寫回配置
          with open(config_path, 'w') as f:
              json.dump(config, f, indent=2)
          
          print("配置已更新")
          EOF
          
          echo "✅ Docker 配置完成"

      - name: Login to GitHub Container Registry
        if: success()
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push Docker image
        if: success()
        run: |
          echo "📦 推送映像到 Registry..."
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ 映像已推送"

      - name: Generate build summary
        if: success()
        run: |
          echo "## ✅ Token Admin API 建置與推送成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 建置資訊" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **平台**: linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- **Dockerfile**: \`./deploy/token-admin-api/Dockerfile\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 映像標籤" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup Docker credentials
        if: always()
        run: |
          echo "🧹 清理 Docker 憑證並恢復配置..."
          
          # 登出 Docker
          docker logout ${{ env.REGISTRY }} 2>/dev/null || true
          
          # 恢復原始配置（如果存在備份）
          if [ -f ~/.docker/config.json.backup ]; then
            mv ~/.docker/config.json.backup ~/.docker/config.json
            echo "✅ 已恢復原始 Docker 配置"
          else
            # 如果沒有備份，使用 Python 清除憑證
            if [ -f ~/.docker/config.json ]; then
              python3 << 'EOF'
          import json
          import os
          
          config_path = os.path.expanduser('~/.docker/config.json')
          
          if os.path.exists(config_path):
              try:
                  with open(config_path, 'r') as f:
                      config = json.load(f)
                  
                  # 清除所有儲存的憑證
                  if 'auths' in config:
                      config['auths'] = {}
                  
                  with open(config_path, 'w') as f:
                      json.dump(config, f, indent=2)
                  
                  print("已清除 Docker 憑證")
              except Exception as e:
                  print(f"清理憑證時發生錯誤: {e}")
          EOF
            fi
          fi
          
          echo "✅ 清理完成"