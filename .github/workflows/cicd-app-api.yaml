name: Build Token App API

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/cicd-app-api.yaml'
      - 'cmd/token-app-api/**'
      - 'pkg/**'
      - 'deploy/token-app-api/**'
      - 'go.mod'
      - 'go.sum'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/token-app-api

permissions:
  contents: read
  packages: write

jobs:
  build-backend-service:
    runs-on: mac-mini-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Legacy Docker Build (last resort)
        run: |
          echo "=== Legacy Docker Build ==="
          
          # 設定變數
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="develop"
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          echo "Building image with legacy docker build: $IMAGE_NAME:$TAG"
          
          echo "Building image with legacy docker build: $IMAGE_NAME:$TAG"
          # 移除舊的建構器（如果存在）
          docker buildx rm multiplatform || true
          
          # 創建新的 buildx 建構器（支援多平台）
          docker buildx create --name multiplatform --driver docker-container --use

          # 啟動建構器
          docker buildx inspect --bootstrap

          # 使用傳統的 docker build
          docker build \
            --file ./deploy/token-app-api/Dockerfile \
            --tag "$IMAGE_NAME:$TAG" \
            --tag "$IMAGE_NAME:develop-$SHORT_SHA" \
            --label "org.opencontainers.image.title=Token App API" \
            --label "org.opencontainers.image.description=PassonTW Token App API" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .
          
          echo "=== Pushing images ==="
          docker push "$IMAGE_NAME:$TAG"
          docker push "$IMAGE_NAME:develop-$SHORT_SHA"
          
          echo "=== Legacy build completed ==="

      - name: Generate build summary
        run: |
          echo "## 🐳 Token App API 建置完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 映像資訊" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: develop, develop-\$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 部署命令" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR (if applicable)
        # if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `## 🐳 Token App API 建置完成
            
            ### 映像資訊
            - **Registry**: ${{ env.REGISTRY }}
            - **Image**: ${{ env.IMAGE_NAME }}
            - **Tags**: develop, develop-${process.env.GITHUB_SHA.substring(0, 7)}
            - **Platform**: linux/amd64
            
            ### 部署命令
            \`\`\`bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
            \`\`\``;
            
            # github.rest.issues.createComment({
            #   issue_number: context.issue.number,
            #   owner: context.repo.owner,
            #   repo: context.repo.repo,
            #   body: output
            # }); 
